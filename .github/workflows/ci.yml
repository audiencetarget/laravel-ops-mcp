name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, sqlite3, pdo_sqlite
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
        working-directory: packages/laravel-ops
      - run: vendor/bin/phpunit
        working-directory: packages/laravel-ops
  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep '  gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks git . --redact --verbose --exit-code 1
